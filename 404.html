<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Baum Design</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#F0EEE7" />
  <!-- This page is shown for any missing URL, however deep (e.g. /old/page),
       so every link below is resolved from the site's root, set here:
       on github.io the site lives in a folder named after the repository
       (/Baum-Design/); on your own domain it's simply "/". -->
  <script>
    (function () {
      var root = "/";
      if (/\.github\.io$/.test(location.hostname)) {
        var first = location.pathname.split("/")[1];
        if (first) root = "/" + first + "/";
      }
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .notfound { flex: 1; display: flex; align-items: center; }
    .notfound { padding-bottom: clamp(56px, 9vw, 120px); }
    .notfound .hero-inner { grid-template-columns: 1fr; border-bottom: 0; }
    .notfound-foot { padding-block: 28px; font-size: 0.875rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="Baum Design — home">
        <img class="brand-mark" src="assets/logo.svg" alt="" />
        <span class="brand-name">Baum Design</span>
      </a>
    </div>
  </header>

  <main class="hero notfound">
    <div class="container hero-inner">
      <div class="hero-copy">
        <p class="eyebrow">Error 404</p>
        <h1 class="hero-title">Nothing’s <span class="accent">growing here.</span></h1>
        <p class="hero-lede">The page you’re looking for has moved, or never existed. Let’s get you back on track.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="./">Back to home</a>
          <a class="btn btn-ghost" href="./#contact">Get in touch <span class="arrow" aria-hidden="true">→</span></a>
        </div>
      </div>
    </div>
  </main>

  <footer class="container notfound-foot">© Baum Design</footer>
</body>
</html>
