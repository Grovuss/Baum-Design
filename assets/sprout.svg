<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <!-- Baum Design — sprouting seedling. Grows once on load (stem draws up,
       leaves unfold); shows fully grown when reduced motion is preferred. -->
  <style>
    .stem   { stroke: #202421; stroke-width: 2; stroke-linecap: round; }
    .ground { stroke: #85877F; stroke-width: 1.5; stroke-linecap: round; }
    .leaf   { fill: #A5B39A; }
    .young  { fill: #8C9C80; }
    .vein   { stroke: #F0EEE7; stroke-width: 1.5; stroke-linecap: round; opacity: .8; }

    @media (prefers-reduced-motion: no-preference) {
      .ground { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s ease-out forwards; }
      .stem   { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.5s cubic-bezier(.45,0,.2,1) .25s forwards; }
      .grow   { transform: scale(0); animation: unfurl 1.1s cubic-bezier(.22,.9,.3,1.1) forwards; }
      .g1 { animation-delay: .9s; }
      .g2 { animation-delay: 1.15s; }
      .g3 { animation-delay: 1.5s; }
      .g4 { animation-delay: 1.62s; }
    }
    /* small sizes (phones/tablets): the page draws a full-width line instead */
    @media (max-width: 300px) { .ground { display: none; } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes unfurl { to { transform: scale(1); } }
  </style>

  <defs>
    <!-- one leaf, base at 0,0, pointing right -->
    <g id="leaf">
      <path class="leaf" d="M0 0 C20 -42 74 -60 128 -50 C120 -6 72 24 0 0 Z" />
      <path class="vein" d="M10 -6 C44 -20 82 -32 108 -42" />
    </g>
    <g id="bud">
      <path class="young" d="M0 0 C14 -30 52 -42 90 -35 C84 -4 50 17 0 0 Z" />
    </g>
  </defs>

  <path class="ground" pathLength="1" d="M110 470 H290" />

  <path class="stem" pathLength="1"
        d="M200 470 C200 424 190 386 195 338 C199 298 210 262 205 218 C202 190 204 168 206 150" />

  <!-- lower leaf, left -->
  <g transform="translate(196 330) rotate(-155)"><g class="grow g1"><use href="#leaf" /></g></g>
  <!-- middle leaf, right -->
  <g transform="translate(206 240) rotate(-26)"><g class="grow g2"><use href="#leaf" /></g></g>
  <!-- new pair opening at the tip -->
  <g transform="translate(206 152) rotate(-128)"><g class="grow g3"><use href="#bud" /></g></g>
  <g transform="translate(206 152) rotate(-52)"><g class="grow g4"><use href="#bud" /></g></g>
</svg>
